services:
  - type: web
    name: closure-evidence-delta
    runtime: docker
    plan: free
    region: oregon
    preDeployCommand: alembic upgrade head
    healthCheckPath: /health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: closure-evidence-delta-db
          property: connectionString
      - key: PUBLIC_DEMO_MODE
        value: "true"
      - key: RUN_EMBEDDED_WORKER
        value: "true"
      - key: ENABLE_MANUAL_DRAIN
        value: "false"
      - key: ENABLE_LOCAL_OCR
        value: "true"

databases:
  - name: closure-evidence-delta-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    databaseName: closure_evidence_delta
    user: closure_evidence_delta
    ipAllowList: []
