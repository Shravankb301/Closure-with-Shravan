services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: evidence_delta
      POSTGRES_USER: evidence_delta
      POSTGRES_PASSWORD: evidence_delta
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidence_delta"]
      interval: 2s
      timeout: 2s
      retries: 15
