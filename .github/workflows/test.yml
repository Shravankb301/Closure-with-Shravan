name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: evidence_delta_test
          POSTGRES_USER: evidence_delta
          POSTGRES_PASSWORD: evidence_delta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evidence_delta"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://evidence_delta:evidence_delta@localhost:5432/evidence_delta_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,postgres]"
      - run: python -m ruff check .
      - run: python -m pytest
