[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-delta-engine"
version = "0.1.0"
description = "A deterministic, provenance-preserving incremental recomputation kernel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]
ai = [
  "anthropic>=0.69,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[project.scripts]
evidence-delta-demo = "evidence_delta.demo:main"
evidence-delta-worker = "evidence_delta.runtime:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evidence_delta = ["static/*.html", "static/*.png", "static/*.svg"]

[tool.vercel]
entrypoint = "src.evidence_delta.api:app"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
